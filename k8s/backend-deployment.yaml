apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockease-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stockease-backend
  template:
    metadata:
      labels:
        app: stockease-backend
    spec:
      containers:
        - name: backend
          image: stockease-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080